name: CI

# Every push (any branch), every pull request and manual runs must
# compile without warnings and pass the full test suite.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Official ROOT image (ROOT + compiler + CMake), pinned by digest to the
# image of the last known-good run (all jobs). To update: run once with
# rootproject/root:latest and take the "Digest:" line of the pull step.
jobs:
  build-and-test:
    name: Build (warnings as errors) + tests + examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rootproject/root:latest@sha256:a2ab342848316c71b803b8cdfb1867b8fc29109671de2268640eb46567272bd0
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKINFIT_BUILD_TESTS=ON
          -DKINFIT_BUILD_EXAMPLES=ON
          -DKINFIT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # --no-tests=error: an empty test list (e.g. tests not built) fails.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j "$(nproc)"

  asan:
    name: AddressSanitizer + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rootproject/root:latest@sha256:a2ab342848316c71b803b8cdfb1867b8fc29109671de2268640eb46567272bd0
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DKINFIT_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build-asan -j "$(nproc)"

      # Leak checking is off: ROOT/cling keep global allocations until exit.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error -j "$(nproc)"
