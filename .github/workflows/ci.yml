name: CI

on:
  push:
    branches: [main]
  pull_request:

# Official ROOT image (ROOT + compiler + CMake), pinned by digest to the
# image of the last known-good run (both jobs). To update: run once with
# rootproject/root:latest and take the "Digest:" line of the pull step.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: rootproject/root:latest@sha256:a2ab342848316c71b803b8cdfb1867b8fc29109671de2268640eb46567272bd0
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DKINFIT_BUILD_TESTS=ON -DKINFIT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  asan:
    runs-on: ubuntu-latest
    container: rootproject/root:latest@sha256:a2ab342848316c71b803b8cdfb1867b8fc29109671de2268640eb46567272bd0
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DKINFIT_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build-asan -j "$(nproc)"

      # Leak checking is off: ROOT/cling keep global allocations until exit.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-asan --output-on-failure -j "$(nproc)"
